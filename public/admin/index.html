<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Manage the site — Hari's Carpets</title>
<link rel="stylesheet" href="../styles.css">
<link rel="stylesheet" href="admin.css">
</head>
<body class="admin">

<header class="mg-top">
  <div class="wrap">
    <a class="mg-logo" href="../">HARI'S CARPETS</a>
    <span class="mg-tag">Manage the site</span>
    <span class="mg-who" id="who"></span>
    <span class="mg-state" id="state"></span>
    <button class="btn btn-solid btn-sm" id="save" disabled>Save changes</button>
  </div>
</header>

<nav class="mg-tabs"><div class="wrap" id="tabs"></div></nav>

<!-- Whatever the last save refused. Empty and hidden until there is something
     to say; see showDropped() in admin.js for why it is this prominent. -->
<div class="wrap"><div class="mg-dropped" id="dropped" hidden></div></div>

<main class="wrap" id="panel">
  <p class="mg-loading">Loading…</p>
</main>

<!-- Nothing here is secret; the API is what's protected. But there is no point
     showing the forms to somebody who cannot save, so the page checks first. -->
<div class="mg-gate" id="gate" hidden>
  <div class="mg-gate-card">
    <h1 id="gateTitle">Sign in to manage the site</h1>
    <p id="gateBody"></p>

    <!-- A real form with a named field, rather than a bare input: password
         managers fill it properly, and generic ids like "pw" are the sort of
         thing content blockers carry cosmetic rules for. -->
    <form class="mg-login" id="login" method="post" action="#" hidden>
      <label class="mg-field" for="adminPassword">
        <span>Site password</span>
      </label>
      <input class="mg-pw" type="password" id="adminPassword" name="password"
             autocomplete="current-password" autocapitalize="off"
             spellcheck="false" required>
      <button class="btn btn-solid" type="submit" id="pwGo">Sign in</button>
      <p class="mg-err" id="pwErr"></p>
    </form>

    <p class="mg-gate-acts">
      <!-- pointless once there is a password box on screen; the form is the
           way back in, and a reload only empties it -->
      <a class="btn btn-ghost" href="./" id="retry">Try again</a>
      <a class="btn btn-ghost" href="../">Back to the website</a>
    </p>
  </div>
</div>

<script src="../data.js"></script>
<script src="admin.js"></script>
</body>
</html>
